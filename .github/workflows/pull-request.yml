name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Start isolated test database
        run: supabase db start
      - name: Lint and test database
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --level error
          database_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for test_file in \
            supabase/tests/database_smoke_test.sql \
            supabase/tests/member_accounts_and_programs_smoke_test.sql
          do
            result="$(psql "$database_url" -X -q -t -A -v ON_ERROR_STOP=1 -f "$test_file")"
            echo "$result" | jq -e 'type == "object" and all(.[]; . == 0)'
          done
          psql "$database_url" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_mvp_functional_test.sql >/dev/null
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
      - name: Stop isolated test database
        if: always()
        run: supabase stop --no-backup
