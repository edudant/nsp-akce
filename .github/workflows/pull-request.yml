name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Start isolated test database
        shell: bash
        run: |
          export NSP_TEST_PROJECT_ID="nsp-feature-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export NSP_TEST_PORT_BASE=$((20000 + (GITHUB_RUN_ID % 3000) * 10 + GITHUB_RUN_ATTEMPT))
          export NSP_TEST_DB_PORT=$((NSP_TEST_PORT_BASE + 1))
          export NSP_TEST_WORKDIR="${RUNNER_TEMP}/nsp-supabase-tests"
          for variable in NSP_TEST_PROJECT_ID NSP_TEST_PORT_BASE NSP_TEST_DB_PORT NSP_TEST_WORKDIR; do
            printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
          done
          node scripts/setup-feature-local.mjs
          supabase start --workdir "$NSP_TEST_WORKDIR" --exclude studio,storage-api,realtime,postgres-meta,logflare,vector,supavisor
          bash scripts/test-feature-local-db.sh --reset
          supabase functions serve --workdir "$NSP_TEST_WORKDIR" --no-verify-jwt > /tmp/nsp-feature-functions.log 2>&1 &
      - name: Lint and test database
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --workdir "$NSP_TEST_WORKDIR" --level error
          database_url="postgresql://postgres:postgres@127.0.0.1:${NSP_TEST_DB_PORT}/postgres"
          for test_file in \
            supabase/tests/database_smoke_test.sql \
            supabase/tests/member_accounts_and_programs_smoke_test.sql
          do
            result="$(psql "$database_url" -X -q -t -A -v ON_ERROR_STOP=1 -f "$test_file")"
            echo "$result" | jq -e 'type == "object" and all(.[]; . == 0)'
          done
          npm run test:integration
          psql "$database_url" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_profile_write_security_test.sql >/dev/null
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
      - name: Stop isolated test database
        if: always()
        run: supabase stop --workdir "$NSP_TEST_WORKDIR" --no-backup
