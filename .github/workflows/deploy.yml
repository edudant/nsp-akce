name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Start isolated test database
        shell: bash
        run: |
          export NSP_TEST_PROJECT_ID="nsp-feature-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export NSP_TEST_PORT_BASE=$((20000 + (GITHUB_RUN_ID % 3000) * 10 + GITHUB_RUN_ATTEMPT))
          export NSP_TEST_DB_PORT=$((NSP_TEST_PORT_BASE + 1))
          export NSP_TEST_WORKDIR="${RUNNER_TEMP}/nsp-supabase-tests"
          for variable in NSP_TEST_PROJECT_ID NSP_TEST_PORT_BASE NSP_TEST_DB_PORT NSP_TEST_WORKDIR; do
            printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
          done
          node scripts/setup-feature-local.mjs
          supabase start --workdir "$NSP_TEST_WORKDIR" --exclude studio,storage-api,realtime,postgres-meta,logflare,vector,supavisor
          bash scripts/test-feature-local-db.sh --reset
          nohup supabase functions serve --workdir "$NSP_TEST_WORKDIR" --no-verify-jwt > /tmp/nsp-feature-functions.log 2>&1 &

      - name: Wait for local Edge Function
        shell: bash
        run: |
          if ! node scripts/wait-feature-function.mjs; then
            tail -100 /tmp/nsp-feature-functions.log
            exit 1
          fi

      - name: Lint and test database
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --workdir "$NSP_TEST_WORKDIR" --level error
          database_url="postgresql://postgres:postgres@127.0.0.1:${NSP_TEST_DB_PORT}/postgres"
          for test_file in \
            supabase/tests/database_smoke_test.sql \
            supabase/tests/member_accounts_and_programs_smoke_test.sql
          do
            result="$(psql "$database_url" -X -q -t -A -v ON_ERROR_STOP=1 -f "$test_file")"
            echo "$result" | jq -e 'type == "object" and all(.[]; . == 0)'
          done
          npm run test:integration
          psql "$database_url" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_profile_write_security_test.sql >/dev/null

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Stop isolated test database
        if: always()
        run: supabase stop --workdir "$NSP_TEST_WORKDIR" --no-backup

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
