name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Start isolated test database
        run: supabase db start

      - name: Lint and test database
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --level error
          database_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for test_file in \
            supabase/tests/database_smoke_test.sql \
            supabase/tests/member_accounts_and_programs_smoke_test.sql
          do
            result="$(psql "$database_url" -X -q -t -A -v ON_ERROR_STOP=1 -f "$test_file")"
            echo "$result" | jq -e 'type == "object" and all(.[]; . == 0)'
          done
          psql "$database_url" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_mvp_functional_test.sql >/dev/null
          psql "$database_url" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_profile_write_security_test.sql >/dev/null

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Stop isolated test database
        if: always()
        run: supabase stop --no-backup

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
